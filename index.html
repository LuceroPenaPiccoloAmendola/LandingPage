<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - SuperMarket</title>
    <link rel="stylesheet" href="estilosVistas.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body style="display:flex; justify-content:center; align-items:center; min-height:100vh; background:#090d16; color:#f8fafc;">
    <div style="background:#0f172a; border:1px solid rgba(255,255,255,0.1); padding:32px; border-radius:14px; width:380px; box-shadow:0 20px 40px rgba(0,0,0,0.5);">
        <div style="display:flex; align-items:center; gap:10px; margin-bottom:20px;">
            <div class="brand-logo">SM</div>
            <div>
                <h2 style="margin:0; font-size:20px;">SuperMarket</h2>
                <p style="margin:0; font-size:12px; color:#94a3b8;">Acceso protegido por roles</p>
            </div>
        </div>

        <form id="loginForm">
            <div style="margin-bottom:14px;">
                <label style="font-size:12px; color:#94a3b8; display:block; margin-bottom:6px;">Correo electrónico</label>
                <input type="email" id="loginEmail" class="input-text" style="width:100%;" required placeholder="usuario@correo.com" />
            </div>
            <div style="margin-bottom:20px;">
                <label style="font-size:12px; color:#94a3b8; display:block; margin-bottom:6px;">Contraseña</label>
                <input type="password" id="loginPassword" class="input-text" style="width:100%;" required placeholder="••••••••" />
            </div>
            <button type="submit" id="btnLogin" class="btn-primary" style="width:100%;">Ingresar</button>
            <p id="loginMensaje" style="margin-top:12px; font-size:12px; color:#f87171; min-height:18px;"></p>
        </form>
    </div>

    <script>
        const SUPABASE_URL = 'https://sppydfpfikqvxaviwfem.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNwcHlkZnBmaWtxdnhhdml3ZmVtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM5MTg0NTcsImV4cCI6MjEwOTQ5NDQ1N30.g17KVS9WLU4uew9uhEh0HqP5Ul-ZwTrgljYXHbBysrA';
        const { createClient } = supabase;
        const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const msg = document.getElementById('loginMensaje');
            const btn = document.getElementById('btnLogin');
            msg.textContent = '';
            btn.disabled = true;

            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;

            const { error } = await _supabase.auth.signInWithPassword({ email, password });
            if (error) {
                msg.textContent = 'Credenciales inválidas o usuario no registrado.';
                btn.disabled = false;
                return;
            }

            const { data: rol, error: rolErr } = await _supabase.schema('dw').rpc('obtener_mi_rol');
            if (rolErr || !rol) {
                msg.textContent = 'Usuario autenticado sin rol asignado en el sistema.';
                await _supabase.auth.signOut();
                btn.disabled = false;
                return;
            }

            window.location.href = rol === 'admin' ? 'admin.html' : 'menu.html';
        });
    </script>
</body>
</html>
