<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sucursales - SuperMarket</title>
    <link rel="stylesheet" href="estilosVistas.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="CRUD.js"></script>
    <style>
        .badge-puesto { background: rgba(147, 51, 234, 0.15); color: #c084fc; border: 1px solid rgba(147, 51, 234, 0.3); padding: 3px 8px; border-radius: 6px; font-size: 12px; }
    </style>
</head>
<body>
    <div class="layout-app">
        <aside class="sidebar-navegacion">
            <div>
                <div class="brand-header"><div class="brand-logo">SM</div><span class="brand-title">SuperMarket</span></div>
                <ul class="nav-lista">
                    <li class="nav-item"><a href="menu.html">📊 Analytics & Tendencias</a></li>
                    <li class="nav-item"><a href="ventas.html">💰 Ventas</a></li>
                    <li class="nav-item"><a href="productos.html">🏷️ Productos</a></li>
                    <li class="nav-item"><a href="inventario.html">📦 Inventario</a></li>
                    <li class="nav-item"><a href="clientes.html">👥 Clientes</a></li>
                    <li class="nav-item active"><a href="sucursales.html">🏢 Sucursales</a></li>
                </ul>
            </div>
            <div style="font-size: 11px; color: #475569; text-align: center;"><a href="index.html" style="color: #94a3b8; text-decoration: none;">← Cerrar Sesión</a></div>
        </aside>
        <main class="contenido-app">
            <div class="top-bar">
                <div class="page-title"><h1>Sucursales y Empleados</h1><p>Gestión paginada del personal</p></div>
            </div>
            <div class="toolbar-filtros">
                <div class="filtros-grupo">
                    <select id="campoColumna" class="input-select">
                        <option value="id_empleado">ID Empleado</option>
                        <option value="nombre">Nombre</option>
                        <option value="puesto">Puesto</option>
                        <option value="id_sucursal">ID Sucursal</option>
                    </select>
                    <select id="campoOperador" class="input-select">
                        <option value="eq">Igual a (=)</option>
                        <option value="ilike">Contiene (Texto)</option>
                    </select>
                    <input type="text" id="valorBusqueda" class="input-text" placeholder="Ingresa un valor..." />
                </div>
                <div class="filtros-grupo">
                    <button class="btn-primary" onclick="aplicarFiltro()">🔍 Consultar</button>
                    <button class="btn-secondary" onclick="resetearTodo()">Mostrar Todo</button>
                    <button class="btn-primary" style="background: linear-gradient(135deg, #10b981, #059669);" onclick="abrirModalCRUD()">+ Nuevo Empleado</button>
                </div>
            </div>
            <div class="tabla-card">
                <table class="tabla-custom">
                    <thead>
                        <tr>
                            <th>ID Empleado</th>
                            <th>Nombre</th>
                            <th>Puesto</th>
                            <th>Sucursal Asignada</th>
                            <th style="text-align: center;">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tablaCuerpo"></tbody>
                </table>
                <div class="paginacion-container">
                    <div class="paginacion-info" id="infoPaginacion">Mostrando registros...</div>
                    <div class="paginacion-botones">
                        <button class="btn-pagina" id="btnAnterior" onclick="cambiarPagina(-1)" disabled>← Anterior</button>
                        <button class="btn-pagina" id="btnSiguiente" onclick="cambiarPagina(1)">Siguiente →</button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- MODAL GENERAL PARA CREAR/EDITAR EMPLEADO -->
    <div id="modalForm" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); backdrop-filter:blur(5px); z-index:1000; justify-content:center; align-items:center;">
        <div style="background:#0f172a; border:1px solid rgba(255,255,255,0.1); padding:30px; border-radius:14px; width:400px; box-shadow: 0 20px 40px rgba(0,0,0,0.5);">
            <h3 id="modalTitulo" style="margin-bottom:20px; color:#f8fafc;">Registro</h3>
            <input type="hidden" id="formId" />

            <div style="margin-bottom:15px;">
                <label style="font-size:12px; color:#94a3b8; display:block; margin-bottom:5px;">Nombre:</label>
                <input type="text" id="formNombre" class="input-text" style="width:100%;" />
            </div>
            <div style="margin-bottom:15px;">
                <label style="font-size:12px; color:#94a3b8; display:block; margin-bottom:5px;">Puesto:</label>
                <input type="text" id="formPuesto" class="input-text" style="width:100%;" />
            </div>
            <div style="margin-bottom:20px;">
                <label style="font-size:12px; color:#94a3b8; display:block; margin-bottom:5px;">ID Sucursal:</label>
                <input type="number" id="formIdSucursal" class="input-text" style="width:100%;" />
            </div>

            <div style="display:flex; justify-content:flex-end; gap:10px;">
                <button class="btn-secondary" onclick="cerrarModalCRUD()">Cancelar</button>
                <button class="btn-primary" onclick="guardarRegistroCRUD(_supabase, () => cargarDatos(0))">Guardar</button>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://sppydfpfikqvxaviwfem.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNwcHlkZnBmaWtxdnhhdml3ZmVtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM5MTg0NTcsImV4cCI6MjEwOTQ5NDQ1N30.g17KVS9WLU4uew9uhEh0HqP5Ul-ZwTrgljYXHbBysrA';
        const { createClient } = supabase;
        const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        configurarCRUD({
            tabla: 'dim_empleado',
            idField: 'id_empleado',
            nombreModulo: 'Empleado',
            campos: [
                { inputId: 'formNombre', columna: 'nombre', label: 'Nombre', tipo: 'texto', requerido: true },
                { inputId: 'formPuesto', columna: 'puesto', label: 'Puesto', tipo: 'texto', requerido: false },
                { inputId: 'formIdSucursal', columna: 'id_sucursal', label: 'ID Sucursal', tipo: 'numero', requerido: false }
            ]
        });

        let paginaActual = 0;
        const registrosPorPagina = 10;
        let modoFiltrado = false;

        async function cargarDatos(saltoPagina = 0) {
            paginaActual += saltoPagina;
            if (paginaActual < 0) paginaActual = 0;
            const desde = paginaActual * registrosPorPagina;
            const hasta = desde + registrosPorPagina - 1;

            let query = _supabase.schema('dw').from('dim_empleado').select('*', { count: 'exact' });

            if (modoFiltrado) {
                const columna = document.getElementById('campoColumna').value;
                const operador = document.getElementById('campoOperador').value;
                const valor = document.getElementById('valorBusqueda').value.trim();
                if (operador === 'eq') query = query.eq(columna, valor);
                else if (operador === 'ilike') query = query.ilike(columna, `%${valor}%`);
            }

            const { data, error, count } = await query
                .order('id_empleado', { ascending: true })
                .range(desde, hasta);

            if (error) { console.error(error); return; }
            renderizarTabla(data, count, desde, hasta);
        }

        function aplicarFiltro() {
            if (document.getElementById('valorBusqueda').value.trim() === '') { alert('Ingresa un valor'); return; }
            modoFiltrado = true; paginaActual = 0; cargarDatos(0);
        }
        function resetearTodo() { document.getElementById('valorBusqueda').value = ''; modoFiltrado = false; paginaActual = 0; cargarDatos(0); }
        function cambiarPagina(dir) { cargarDatos(dir); }

        function renderizarTabla(data, totalRegistros, desde, hasta) {
            const tbody = document.getElementById('tablaCuerpo');
            tbody.innerHTML = '';
            if (!data || data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" style="text-align: center; padding: 30px; color: #f59e0b;">No se encontraron registros.</td></tr>`;
                document.getElementById('infoPaginacion').textContent = 'Mostrando 0 de 0';
                document.getElementById('btnAnterior').disabled = true; document.getElementById('btnSiguiente').disabled = true;
                return;
            }
            data.forEach(item => {
                const id = item.id_empleado;
                tbody.innerHTML += `<tr>
                    <td><span class="badge-id">#EMP-${id ?? '00'}</span></td>
                    <td><strong>${item.nombre ?? 'N/A'}</strong></td>
                    <td><span class="badge-puesto">${item.puesto ?? 'N/A'}</span></td>
                    <td>Suc. #${item.id_sucursal ?? 'N/A'}</td>
                    <td style="text-align: center;">
                        <button class="btn-secondary" style="padding: 5px 10px; font-size: 11px;" onclick='abrirModalCRUD(${JSON.stringify(item)})'>✏️ Editar</button>
                        <button class="btn-primary" style="padding: 5px 10px; font-size: 11px; background: #ef4444; box-shadow: none;" onclick="eliminarRegistroCRUD(_supabase, ${id}, () => cargarDatos(0))">🗑️ Borrar</button>
                    </td>
                </tr>`;
            });
            const hastaMostrado = Math.min(hasta + 1, totalRegistros);
            document.getElementById('infoPaginacion').textContent = `Mostrando ${desde + 1} - ${hastaMostrado} de ${totalRegistros} registros`;
            document.getElementById('btnAnterior').disabled = paginaActual === 0;
            document.getElementById('btnSiguiente').disabled = hastaMostrado >= totalRegistros;
        }
        cargarDatos(0);
    </script>
</body>
</html>
